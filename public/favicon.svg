<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fav-node-grad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="fav-bracket-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A1330" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>
  <!-- Left Bracket < -->
  <path d="M 36 28 L 18 50 L 36 72" stroke="#0B1B3D" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Bracket > -->
  <path d="M 64 28 L 82 50 L 64 72" stroke="#0B1B3D" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central Network Nodes and Connecting Lines -->
  <g stroke="url(#fav-node-grad)" stroke-width="2.2" opacity="0.85">
    <line x1="50" y1="36" x2="40" y2="44" />
    <line x1="50" y1="36" x2="60" y2="44" />
    <line x1="40" y1="44" x2="38" y2="56" />
    <line x1="60" y1="44" x2="62" y2="56" />
    <line x1="38" y1="56" x2="50" y2="64" />
    <line x1="62" y1="56" x2="50" y2="64" />
    <line x1="40" y1="44" x2="50" y2="50" />
    <line x1="60" y1="44" x2="50" y2="50" />
    <line x1="50" y1="50" x2="50" y2="64" />
  </g>
  
  <!-- Nodes (circles) -->
  <circle cx="50" cy="36" r="4.5" fill="#9333EA" />
  <circle cx="40" cy="44" r="4" fill="#A855F7" />
  <circle cx="60" cy="44" r="4" fill="#7C3AED" />
  <circle cx="50" cy="50" r="5" fill="#6366F1" />
  <circle cx="38" cy="56" r="4.2" fill="#4F46E5" />
  <circle cx="62" cy="56" r="4.2" fill="#3B82F6" />
  <circle cx="50" cy="64" r="4.8" fill="#2563EB" />
</svg>
